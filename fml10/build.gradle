plugins {
    id 'java-library'
}

repositories {
    maven {
        name = 'neoforged'
        url = 'https://maven.neoforged.net/releases'
    }
    maven {
        name = 'minecraft'
        url = 'https://libraries.minecraft.net'
        content {
            includeGroup 'com.mojang'
        }
    }
}

// The root build makes compileOnly extend annotationProcessor, which puts
// Jabel's javac plugin on the compiler classpath even if processing is off.
configurations.compileOnly.setExtendsFrom([])

// The emitted class files are version 61, but they implement FML classes
// that require Java 21. Resolve and advertise this module as a Java 21 API.
['compileClasspath', 'apiElements', 'runtimeElements'].each { name ->
    configurations.named(name) {
        attributes.attribute(org.gradle.api.attributes.java.TargetJvmVersion.TARGET_JVM_VERSION_ATTRIBUTE, 21)
    }
}

dependencies {
    implementation project(':')
    compileOnly 'net.neoforged.fancymodloader:loader:10.0.14'
}

// FML 10's API requires Java 21 at runtime and on the compile classpath.
// Compile with JDK 21 but emit Java 17 bytecode: Shadow 8.1.1's ASM cannot
// parse Java 21 class files when assembling the universal artifact.
java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

tasks.named('compileJava', JavaCompile) {
    sourceCompatibility = '21'
    targetCompatibility = '21'
    options.release = 17
    // The root build adds Jabel to every Java project. Its bundled Byte Buddy
    // cannot read Java 21 classes, and this adapter uses no annotation processors.
    options.annotationProcessorPath = files()
    javaCompiler = javaToolchains.compilerFor {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

tasks.named('compileTestJava', JavaCompile) {
    sourceCompatibility = '21'
    targetCompatibility = '21'
    options.release = 17
    options.annotationProcessorPath = files()
    javaCompiler = javaToolchains.compilerFor {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

tasks.named('test', Test) {
    javaLauncher = javaToolchains.launcherFor {
        languageVersion = JavaLanguageVersion.of(21)
    }
}
