plugins {
    id 'java-library'
}

repositories {
    maven {
        name = 'neoforged'
        url = 'https://maven.neoforged.net/releases'
    }
}

dependencies {
    implementation project(':')
    compileOnly 'net.neoforged.fancymodloader:loader:10.0.14'
}

// FML 10's API requires a Java 21 compiler. Emit Java 17 bytecode so the
// existing Shadow plugin can package this class without parsing Java 21 bytecode.
tasks.named('compileJava', JavaCompile) {
    options.release = 17
    javaCompiler = javaToolchains.compilerFor {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

tasks.named('compileTestJava', JavaCompile) {
    options.release = 17
    javaCompiler = javaToolchains.compilerFor {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

tasks.named('test', Test) {
    javaLauncher = javaToolchains.launcherFor {
        languageVersion = JavaLanguageVersion.of(21)
    }
}
