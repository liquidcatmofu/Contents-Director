plugins {
    id 'java-library'
}

repositories {
    maven {
        name = 'neoforged'
        url = 'https://maven.neoforged.net/releases'
    }
    maven {
        name = 'minecraft'
        url = 'https://libraries.minecraft.net'
        content {
            includeGroup 'com.mojang'
        }
    }
}

// The root build makes compileOnly extend annotationProcessor, which puts
// Jabel's javac plugin on the compiler classpath even if processing is off.
configurations.compileOnly.setExtendsFrom([])

dependencies {
    implementation project(':')
    compileOnly 'net.neoforged.fancymodloader:loader:10.0.14'
}

// FML 10's API is a Java 21 component. Keep its compile and runtime variants
// on Java 21; the universal artifact includes this module as a file dependency.
java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

tasks.named('compileJava', JavaCompile) {
    sourceCompatibility = '21'
    targetCompatibility = '21'
    options.release = 21
    // The root build adds Jabel to every Java project. Its bundled Byte Buddy
    // cannot read Java 21 classes, and this adapter uses no annotation processors.
    options.annotationProcessorPath = files()
    javaCompiler = javaToolchains.compilerFor {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

tasks.named('compileTestJava', JavaCompile) {
    sourceCompatibility = '21'
    targetCompatibility = '21'
    options.release = 21
    options.annotationProcessorPath = files()
    javaCompiler = javaToolchains.compilerFor {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

tasks.named('test', Test) {
    javaLauncher = javaToolchains.launcherFor {
        languageVersion = JavaLanguageVersion.of(21)
    }
}
