plugins {
    id 'java-library'
}

repositories {
    maven {
        name = 'neoforged'
        url = 'https://maven.neoforged.net/releases'
    }
}

dependencies {
    implementation project(':')
    compileOnly 'net.neoforged.fancymodloader:loader:10.0.14'
}

// FML 10's API is a Java 21 component. Keep its compile and runtime variants
// on Java 21; the universal artifact includes this module as a file dependency.
tasks.named('compileJava', JavaCompile) {
    options.release = 21
    javaCompiler = javaToolchains.compilerFor {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

tasks.named('compileTestJava', JavaCompile) {
    options.release = 21
    javaCompiler = javaToolchains.compilerFor {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

tasks.named('test', Test) {
    javaLauncher = javaToolchains.launcherFor {
        languageVersion = JavaLanguageVersion.of(21)
    }
}
