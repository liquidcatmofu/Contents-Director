name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  release-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Test SemVer validation
        run: python3 .github/scripts/validate_semver.py --self-test

  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Java 8 test runtime
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 8

      - name: Install Java 17 compiler
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Install Java 21 for FML 10
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Build
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon build

      - uses: actions/upload-artifact@v4
        with:
          name: jars-${{ matrix.os }}
          path: |
            universal/build/libs/ContentsDirector-*-all.jar
            launchwrapper/build/libs/ContentsDirector-launchwrapper-*-all.jar
            modlauncher/build/libs/ContentsDirector-modlauncher-*-all.jar

  neoforge-server-smoke:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Download built universal JAR
        uses: actions/download-artifact@v4
        with:
          name: jars-ubuntu-latest
          path: artifacts

      - name: Smoke test NeoForge dedicated server early startup
        shell: bash
        run: bash .github/scripts/smoke_neoforge_server.sh artifacts
