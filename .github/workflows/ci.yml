name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Java 8 test runtime
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 8

      - name: Install Java 17 compiler
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Build
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon build

      - uses: actions/upload-artifact@v4
        with:
          name: jars-${{ matrix.os }}
          path: |
            universal/build/libs/ContentsDirector-*-all.jar
            launchwrapper/build/libs/ContentsDirector-launchwrapper-*-all.jar
            modlauncher/build/libs/ContentsDirector-modlauncher-*-all.jar
